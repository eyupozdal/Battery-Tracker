name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Surum
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.release.tag_name }}".TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Derle
        shell: pwsh
        run: >
          dotnet publish src/PilTakip.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o src/bin/publish

      - name: Kurulum dosyasi
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss

      - name: Release'e yukle
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem src/bin/installer/*.exe) --clobber
